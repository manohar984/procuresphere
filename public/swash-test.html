<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Courgette&family=Lobster+Two:ital,wght@1,700&family=Norican&family=Oleo+Script+Swash+Caps:wght@700&family=Playball&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
  <style>
    body { background: #f6f8fb; padding: 25px 40px; font-family: sans-serif; color: #101a2d; }
    .ref-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 2px solid #2858e8; }
    .card { background: white; padding: 18px 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 14px rgba(16,26,45,0.06); }
    .name { font-size: 14px; font-weight: 700; color: #526784; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .title { font-size: 76px; line-height: 0.98; letter-spacing: -0.02em; }
    .blue { color: #2858e8; }
  </style>
</head>
<body>
  <div class="ref-box">
    <div class="name" style="color: #2858e8;">Target Reference Image (Actual Crop):</div>
    <img src="/headline_crop.png" style="max-width: 650px; display: block;">
  </div>

  <div class="card">
    <div class="name">1. Berkshire Swash (Requested test font)</div>
    <div class="title" style="font-family: 'Berkshire Swash', cursive;">Procurement,<br><span class="blue">Connected.</span></div>
  </div>

  <div class="card">
    <div class="name">2. Playball</div>
    <div class="title" style="font-family: 'Playball', cursive;">Procurement,<br><span class="blue">Connected.</span></div>
  </div>

  <div class="card">
    <div class="name">3. Playfair Display 900 Italic</div>
    <div class="title" style="font-family: 'Playfair Display', serif; font-style: italic; font-weight: 900;">Procurement,<br><span class="blue">Connected.</span></div>
  </div>

  <div class="card">
    <div class="name">4. Lobster Two 700 Italic</div>
    <div class="title" style="font-family: 'Lobster Two', cursive; font-style: italic; font-weight: 700;">Procurement,<br><span class="blue">Connected.</span></div>
  </div>

  <div class="card">
    <div class="name">5. Courgette</div>
    <div class="title" style="font-family: 'Courgette', cursive;">Procurement,<br><span class="blue">Connected.</span></div>
  </div>
</body>
</html>
